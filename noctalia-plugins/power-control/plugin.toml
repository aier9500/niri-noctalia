id           = "aier9500/power-control"
name         = "Power Control"
version      = "1.0.0"
plugin_api   = 14
author       = "aier9500"
license      = "MIT"
icon         = "cpu-2"
description  = "dGPU sleep state, cardwire GPU mode switching, and asusctl battery charge limit."
dependencies = ["cardwire", "asusctl"]
tags         = ["hardware", "gpu", "battery", "bar", "panel", "asus"]

[[setting]]
key             = "pci_address"
type            = "string"
label_key       = "settings.pci_address.label"
description_key = "settings.pci_address.description"
default         = ""

[[setting]]
key             = "poll_seconds"
type            = "int"
label_key       = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default         = 10
min             = 1
max             = 60

[[widget]]
id    = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key             = "show_wattage"
  type            = "bool"
  label_key       = "settings.show_wattage.label"
  description_key = "settings.show_wattage.description"
  default         = true

  [[widget.setting]]
  key             = "show_gpu_state"
  type            = "bool"
  label_key       = "settings.show_gpu_state.label"
  description_key = "settings.show_gpu_state.description"
  default         = true

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 340
height          = 540
placement       = "attached"
position        = "auto"
open_near_click = true
