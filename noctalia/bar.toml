# Floating long-island bar: detached from the screen edge, near-full width.
# Widgets sit in capsule pills; quick-settings cluster is one grouped pill.

# These are just defaults, you can override them without changing this file
# by using the Noctalia Settings GUI.

[bar]
order = ["default"]

[bar.default]
position             = "bottom"
background_opacity   = 0.7
scale                = 0.9  # no font-size key in beta.8; scales text + icons
margin_edge          = 8    
margin_ends          = 8    
concave_edge_corners = false

capsule = true              # every widget in its own pill unless grouped

start  = ["workspaces", "taskbar"]
center = ["media"]
end    = ["tray", "group:utilities", "aier9500/power-control:widget", "battery", "group:qs", "clock", "notifications"]

[[bar.default.capsule_group]]
id      = "utilities"
members = ["alexander/screen-toolkit:widget", "gabedunn/voxtype:status"]

[[bar.default.capsule_group]]
id      = "qs"
members = ["network", "bluetooth", "volume", "brightness", "caffeine"]

[widget.workspaces]
show_labels = false

[widget.taskbar]
only_active_workspace = true

[widget.media]
hide_when_no_media = true
title_scroll       = "on_hover"

[widget.battery]
show_label    = true
label_content = "percent"
display_mode  = "graphic"

# Quick-settings pill: icons only.
[widget.network]
show_label = false

[widget.bluetooth]
show_label = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false
#############################

[widget.clock]
format = "{:%Y-%m-%d · %H:%M}"
