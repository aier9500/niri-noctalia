# Lock 15m, screen off 30m, suspend 1h.

[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
timeout = 300
action = "lock"

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"

[idle.behavior.suspend]
timeout = 1200
action = "suspend"
lock_before_suspend = true
