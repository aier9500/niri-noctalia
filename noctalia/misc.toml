# Behavior: nightlight schedule, battery, retention, lock, session actions.
# Appearance keys live in theme.toml.

[nightlight]
enabled           = true    # preset default; override per-machine after install
temperature_day   = 6500
temperature_night = 3500

[battery]
warning_threshold = 20

[notification]
history_retention_hours = 168   # 7 days

[lockscreen]
lock_before_suspend  = true
allow_empty_password = true

# Full action array redeclared (overrides replace it whole); countdown guards
# everything but lock against accidental clicks.
[[shell.session.actions]]
action   = "lock"
shortcut = "1"

[[shell.session.actions]]
action   = "logout"
shortcut = "2"
countdown_seconds = 3.0

[[shell.session.actions]]
action   = "lock_and_suspend"
shortcut = "3"
countdown_seconds = 3.0

[[shell.session.actions]]
action   = "reboot"
shortcut = "4"
countdown_seconds = 3.0

[[shell.session.actions]]
action   = "shutdown"
shortcut = "5"
variant  = "destructive"
countdown_seconds = 3.0
